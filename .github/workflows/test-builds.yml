name: Android and Windows test builds

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [all, android, windows]
        default: all
  push:
    branches:
      - codex/localsend-test-builds

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: '2'

jobs:
  android:
    name: Android debug APK
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.platform != 'windows') ||
      (github.event_name == 'push' && !contains(github.event.head_commit.message, '[windows-only]'))
    concurrency:
      group: localsend-test-android-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Read toolchain pins
        id: pins
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re
          flutter = json.load(open('.fvmrc'))['flutter']
          rust = re.search(r'^channel = "([^"]+)"', open('rust-toolchain.toml').read(), re.M).group(1)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'flutter={flutter}\nrust={rust}\n')
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify the runner Android SDK
        run: |
          test -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -f "$ANDROID_SDK_ROOT/platforms/android-36/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pins.outputs.flutter }}
          channel: stable
          cache: true
      - name: Install pinned Rust and Android targets
        env:
          RUST_VERSION: ${{ steps.pins.outputs.rust }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup target add --toolchain "$RUST_VERSION" aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
      - name: Build and inspect APK
        env:
          FLUTTER_COMMAND: flutter
          GRADLE_OPTS: -Dorg.gradle.workers.max=2
        run: |
          set +e
          bash support/scripts/test_builds/android.sh "$RUNNER_TEMP/localsend-test/android" 2>&1 | tee "$RUNNER_TEMP/localsend-android-build.log"
          build_status=${PIPESTATUS[0]}
          set -e
          if [[ "$build_status" -ne 0 ]]; then
            {
              echo '### Android test build failed'
              echo '```text'
              tail -n 80 "$RUNNER_TEMP/localsend-android-build.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            python3 - "$RUNNER_TEMP/localsend-android-build.log" <<'PY'
          import pathlib, sys
          detail = '\n'.join(pathlib.Path(sys.argv[1]).read_text(errors='replace').splitlines()[-80:])[-8000:]
          detail = detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Android test build failed::{detail}')
          PY
          fi
          exit "$build_status"
      - uses: actions/upload-artifact@v6
        with:
          name: LocalSend-Test-Android
          path: ${{ runner.temp }}/localsend-test/android/
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows x64 portable
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.platform != 'android') ||
      (github.event_name == 'push' && !contains(github.event.head_commit.message, '[android-only]'))
    concurrency:
      group: localsend-test-windows-${{ github.ref }}
      cancel-in-progress: false
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Enable long paths
        run: git config --system core.longpaths true
      - uses: actions/checkout@v6
      - name: Read toolchain pins
        id: pins
        shell: pwsh
        run: |
          $flutter = (Get-Content .fvmrc -Raw | ConvertFrom-Json).flutter
          $rust = [regex]::Match((Get-Content rust-toolchain.toml -Raw), '(?m)^channel = "([^"]+)"').Groups[1].Value
          "flutter=$flutter" >> $env:GITHUB_OUTPUT
          "rust=$rust" >> $env:GITHUB_OUTPUT
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pins.outputs.flutter }}
          channel: stable
          cache: true
      - name: Install pinned Rust
        env:
          RUST_VERSION: ${{ steps.pins.outputs.rust }}
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and package portable Windows app
        run: |
          try {
            ./support/scripts/test_builds/windows.ps1 -RepoRoot $env:GITHUB_WORKSPACE -OutputDirectory "$env:RUNNER_TEMP/localsend-test/windows" -FlutterCommand flutter
          } catch {
            $diagnostic = $_.Exception.Message
            $stack = $_.ScriptStackTrace
            @('### Windows test build failed', '```text', $diagnostic, $stack, '```') | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            $annotation = ($diagnostic + "`n" + $stack).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows test build failed::$annotation"
            throw
          }
      - uses: actions/upload-artifact@v6
        with:
          name: LocalSend-Test-Windows-x64
          path: ${{ runner.temp }}/localsend-test/windows/
          if-no-files-found: error
          retention-days: 30
